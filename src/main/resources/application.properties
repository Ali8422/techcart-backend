# Application
spring.application.name=techcart-backend
# Server Port Configuration
#server.port=8081

# PostgreSQL Database Connection Settings
# Added ?sslmode=disable to stop the SSL handshake hang
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/techcart?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver


# Explicit HikariCP Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000

# Unified Hibernate / JPA Settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration Security String
app.jwt.secret=9a4f2c8d3e1b7a6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c
logging.level.org.hibernate=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
